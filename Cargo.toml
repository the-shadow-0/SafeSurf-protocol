[workspace]
members = [
    "safe_surf_core",
    "safe_surfd",
    "safe_surf_cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SafeSurf Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/the-shadow-0/SafeSurf-protocol"
description = "A defensive, privacy-first safety layer for secure deep-web navigation."

[workspace.dependencies]
safe_surf_core = { path = "safe_surf_core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.1" # MessagePack
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
argon2 = "0.5"
bloomfilter = "1.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
axum = "0.7" # For the daemon's REST API
tower-http = { version = "0.5", features = ["cors", "trace"] }
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
ammonia = "3.3" # HTML Sanitization 
